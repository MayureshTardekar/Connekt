plugins {
    id 'com.android.application'
    // id 'com.google.gms.google-services' // Will uncomment when google-services.json is added
}

android {
    namespace 'com.campushive.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.campushive.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // Lottie — For smooth splash and empty-state animations
    implementation 'com.airbnb.android:lottie:6.4.0'

    // Glide — Premium image loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    
    // CircleImageView
    implementation 'de.hdodenhof:circleimageview:3.1.0'
}
